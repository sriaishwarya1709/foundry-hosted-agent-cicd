# Hosted agent definition consumed by scripts/deploy_agent.py.
name: contoso-support-desk
description: Multi-agent support desk (triage -> specialist -> reviewer) built with Microsoft Agent Framework.
protocols:
  - protocol: responses
    version: 2.0.0
resources:
  cpu: "1"
  memory: 2Gi
# Values are read from the deployment environment (azd env) at deploy time.
environment_variables:
  - AZURE_AI_MODEL_DEPLOYMENT_NAME
